<html lang="en">
  <head>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07111e" />
    <meta name="robots" content="noindex,follow" />
    <title>Portfolio | MOB EXTRA</title>
    <link rel="stylesheet" href="../../assets/css/portfolio-viewer.css" />
    <script src="../../assets/js/portfolio-viewer.js" defer></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.3.1/css/all.min.css"
      onerror="document.documentElement.classList.add('fa-unavailable')"
    />
    <link rel="stylesheet" href="../../assets/css/fontawesome-fallback.css" />
    <script defer src="../../assets/js/fontawesome-fallback.js"></script>
  </head>
  <body>
    <div class="portfolio-viewer-control">
      <button
        class="portfolio-viewer-drag-handle"
        type="button"
        aria-label="Drag to move back to portfolios button"
        aria-describedby="portfolio-viewer-back-help"
      >
        <i class="fa-solid fa-grip" aria-hidden="true"></i
        ><small aria-hidden="true">DRAG</small>
      </button>
      <a class="portfolio-viewer-back" href="index.html"
        ><span aria-hidden="true"
          ><i class="fa-solid fa-arrow-left" aria-hidden="true"></i
        ></span>
        BACK</a
      >
    </div>
    <span class="portfolio-viewer-back-help" id="portfolio-viewer-back-help"
      >Drag the dotted handle to move the back button. With the handle focused,
      use the arrow keys to reposition it.</span
    >
    <span class="portfolio-viewer-back-status" aria-live="polite"></span>
    <p class="portfolio-viewer-error" hidden>
      Portfolio page not found. <a href="index.html">Return to portfolios</a>.
    </p>
    <iframe
      class="portfolio-viewer-frame"
      title="Selected MOB EXTRA portfolio"
      allow="clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
  </body>
